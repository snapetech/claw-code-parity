workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test

variables:
  CARGO_TERM_COLOR: always

rust:fmt:
  stage: test
  image: rust:1.93-bookworm
  before_script:
    - rustup component add rustfmt
  script:
    - cd rust
    - cargo fmt --all --check

rust:test:
  stage: test
  image: rust:1.93-bookworm
  script:
    - cd rust
    - cargo test -p rusty-claude-cli
